name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev mesa-utils ninja-build libglu1-mesa \
            clang cmake pkg-config libblkid-dev liblzma-dev

      - name: Setup cmdline-tools
        run: |
          sudo mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip -d $ANDROID_HOME/cmdline-tools
          sudo mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest || true
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet[all]

      - name: Pre-install Flutter 3.44.8
        run: |
          mkdir -p /home/runner/flutter
          cd /home/runner/flutter
          wget -q https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.8-stable.tar.xz
          tar xf flutter_linux_3.44.8-stable.tar.xz
          mv flutter 3.44.8
          /home/runner/flutter/3.44.8/bin/flutter config --no-analytics --enable-linux-desktop || true
          /home/runner/flutter/3.44.8/bin/flutter --version

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          flet build apk --verbose 2>&1 | tee build.log
          echo "Build finished with code: ${PIPESTATUS[0]}"

      - name: Show last lines of log
        if: always()
        run: tail -n 300 build.log || true

      - name: Check for APK
        if: always()
        run: |
          echo "=== searching apk files ==="
          find . -name "*.apk" -type f 2>&1 || echo "no apk found"
          echo "=== build/apk ==="
          ls -la build/apk/ 2>&1 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: build/apk/*.apk
          if-no-files-found: warn

      - name: Create Release
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ???? v${{ github.run_number }}
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}