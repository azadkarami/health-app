name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android env vars
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet[all]

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Debug info
        run: |
          echo "=== files ==="
          ls -la
          echo "=== pyproject.toml ==="
          cat pyproject.toml || echo "NOT FOUND!"
          echo "=== ANDROID_HOME ==="
          echo $ANDROID_HOME
          ls $ANDROID_HOME || echo "no android dir"

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          FLUTTER_SUPPRESS_ANALYTICS: "true"
        run: |
          set -o pipefail
          yes | flet build apk --verbose 2>&1 | tee build.log

      - name: Show last lines of log
        if: always()
        run: tail -n 300 build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: build/apk/*.apk

      - name: Create Release
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ???? v${{ github.run_number }}
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}